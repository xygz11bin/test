<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查询测试记录</title>

    <!-- 引入 Bootstrap 和 DataTables 的 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dataTables.bootstrap5.min.css') }}">
</head>
<style>
    .back-button {
        position: absolute;
        top: 15px;
        left: 15px;
        color: #007bff;
        text-decoration: none;
    }
</style>
<body>
    <div class="container mt-4">
        <a href="{{ url_for('home') }}" class="back-button">&larr; 返回主页</a>
        <h1 class="text-center">查询安规测试记录</h1>

        <form id="queryForm" class="row g-3 mb-4">
            <div class="col-md-3">
                <label for="serialNumber" class="form-label">序列号:</label>
                <input type="text" class="form-control" id="serialNumber" name="serialNumber">
            </div>

            <div class="col-md-3">
                <label for="result" class="form-label">结果:</label>
                <select class="form-select" id="result" name="result">
                    <option value="">全部</option>
                    <option value="PASS">PASS</option>
                    <option value="FAIL">FAIL</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="startDate" class="form-label">开始日期:</label>
                <input type="date" class="form-control" id="startDate" name="startDate">
            </div>

            <div class="col-md-3">
                <label for="endDate" class="form-label">结束日期:</label>
                <input type="date" class="form-control" id="endDate" name="endDate">
            </div>

            <div class="col-12 text-center">
                <button type="submit" class="btn btn-primary">查询</button>
            </div>
        </form>
        <p id="queryStatus"></p>

        <table id="resultsTable" class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>序列号</th>
                    <th>时间戳</th>
                    <th>结果</th>
                    <th>FlowTag</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- 引入 jQuery, Bootstrap 和 DataTables 的 JS -->
    <script src="{{ url_for('static', filename='js/jquery-3.6.0.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.dataTables.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dataTables.bootstrap5.min.js') }}"></script>


    
    <script>
        $(document).ready(function() {
            var table = $('#resultsTable').DataTable();
    
            $('#queryForm').on('submit', function(event) {
                event.preventDefault();
    
                // 显示查询状态并禁用查询按钮
                $('#queryStatus').text('正在查询...');
                $('#searchBtn').attr('disabled', true);
    
                $.ajax({
                    url: '/Hipotsearch',
                    method: 'POST',
                    data: $(this).serialize(),
                    success: function(data) {
                        table.clear();
                        data.forEach(function(row) {
                            // SerialNumber 设置为链接，隐藏 GUID，查询 GUID 时仍使用
                            table.row.add([
                                `<a href="/Hipotrecord/${row.GUID}" target="_blank">${row.SerialNumber}</a>`,
                                row.TimeStamp,
                                row.Result,
                                row.FlowTag
                            ]).draw();
                        });
    
                        // 显示查询完成的状态
                        $('#queryStatus').text('查询完成');
                    },
                    error: function() {
                        $('#queryStatus').text('查询失败，请重试');
                    },
                    complete: function() {
                        // 启用查询按钮
                        $('#searchBtn').attr('disabled', false);
                    }
                });
            });
        });
    </script>
    
</body>
</html>
